<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GenSticker · 新模板审核</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ee;color:#252925;font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;border:1px solid #c9cec6;background:#fff;padding:8px 13px;border-radius:7px;color:inherit}button:hover{border-color:#55715d}button.active,.approve{background:#305d48;color:white;border-color:#305d48}.adjust{color:#895b15}.reject{color:#9a4540}header{background:#fff;border-bottom:1px solid #dcded8;padding:25px 30px 19px}h1{font-size:25px;margin:2px 0 8px}h2{font-size:21px;margin:0}.eyebrow{font-size:12px;letter-spacing:1.7px;color:#69776b}.intro{margin:0;color:#626b62;max-width:900px}.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:18px}.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:#657065}.toolbar{position:sticky;top:0;background:#f5f3eef7;padding:14px 30px;display:flex;flex-wrap:wrap;gap:9px;align-items:center;border-bottom:1px solid #dcded8;z-index:2}input,select,textarea{padding:8px 10px;border:1px solid #cbd0c6;border-radius:6px;background:#fff;color:inherit}#query{min-width:220px;flex:1}.quiet{color:#6e776d;font-size:13px}.content{padding:18px 30px 30px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(295px,1fr));gap:18px}.card{background:#fff;border:1px solid #d8ddd4;border-radius:9px;overflow:hidden}.card-head{padding:13px 14px 8px}.card h3{font-size:16px;margin:2px 0 4px}.badges{display:flex;gap:7px;flex-wrap:wrap;font-size:12px;color:#657065}.pair{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:#ebece5;padding:8px}.pair figure{margin:0;text-align:center}.pair img{width:100%;height:170px;object-fit:contain;background:#f8f8f5;cursor:pointer}.pair figcaption{font-size:11px;color:#626d60}.card-bottom{padding:10px 14px}.terms{font-size:12px;color:#5d6c5d;max-height:41px;overflow:hidden;margin:7px 0}.rating{font-size:13px;color:#695c3e}.pager{display:flex;align-items:center;justify-content:center;gap:14px;padding:25px}.modal{display:none;position:fixed;inset:0;background:#17231ce0;z-index:5;overflow:auto;padding:25px}.modal.open{display:block}.detail{max-width:1250px;margin:auto;background:#f8f7f2;border-radius:10px;padding:24px}.detail-head{display:flex;justify-content:space-between;align-items:start;gap:15px;margin-bottom:18px}.detail-media{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}.detail-media figure{margin:0;background:white;border:1px solid #d5dcd1;padding:12px}.detail-media img{width:100%;height:280px;object-fit:contain}.detail-media figcaption{font-weight:600}.detail-media .frames{height:auto;margin-top:8px;border-top:1px solid #e5e8e1}.checks{display:flex;gap:15px;flex-wrap:wrap;font-size:13px;margin:15px 0;color:#626e60}.review-form{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:17px}.review-form label{display:block;font-size:13px}.review-form input,.review-form textarea{width:100%;margin-top:4px}.wide{grid-column:1/-1}.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:16px}.notice{border-left:3px solid #b58b39;padding:8px 12px;background:#f1eddf;font-size:13px;margin:14px 0}.caption-list{font-size:13px;white-space:pre-wrap}.detail-links a{color:#35624d;margin-right:16px}.error{color:#ae3d36}footer{padding:0 30px 30px;color:#6a7467;font-size:12px}#empty{padding:45px;text-align:center;color:#697365}#saved{margin-left:auto}summary{cursor:pointer}.source-key{font:11px/1.5 ui-monospace,monospace;word-break:break-all;color:#74806e}@media(max-width:650px){header,.toolbar,.content{padding-left:15px;padding-right:15px}.modal{padding:8px}.detail{padding:16px}.review-form{grid-template-columns:1fr}.stats{gap:20px}.grid{grid-template-columns:1fr}.detail-media img{height:235px}}
</style>
<header><div class="eyebrow">GENSTICKER / LIBRARY REVIEW · 2026.10.30</div><h1>新模板，先看成品再入库</h1><p class="intro">原图、实际替换结果与完整动图并排审核。你标记“可用”后仍需执行入库；页面不会自动发布。测试头像和成品仅保存在本机。</p><div class="stats" id="stats"></div></header>
<div class="toolbar"><input id="query" placeholder="搜索名字、角色、动作、关键词"><select id="kind"><option value="all">全部动静类型</option><option value="gif">仅实际多帧 GIF</option><option value="image">需要上传头像</option><option value="text">仅改原文</option><option value="rank">有来源榜单排名</option></select><select id="state"><option value="pending">尚未审核</option><option value="all">全部可审核成品</option><option value="approved">可用，待入库</option><option value="adjust">需要调整</option><option value="reject">不要</option><option value="failed">尚未生成可审成品</option></select><button id="refresh">刷新候选</button><button id="export">导出审核 JSON</button><span id="count" class="quiet"></span></div>
<main class="content"><div id="grid" class="grid"></div><div id="empty" hidden>当前筛选条件下没有候选。</div><div class="pager"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div></main>
<footer id="footer">每一帧的轨迹与遮挡为离线提案，渲染成功不等于视觉合格。重点看原眼睛/嘴巴残留、手和道具、字幕完整性、侧脸及动图全循环。来源榜单有明确标注；旧仓库参考素材没有虚构热度。</footer>
<div class="modal" id="modal"><article class="detail" id="detail"></article></div>
<script>
const $=id=>document.getElementById(id),el=(tag,cls,text)=>{let n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
let DATA={rows:[]},filtered=[],page=1,opened='',order=[];const labels={approved:'可用，待入库',adjust:'需要调整',reject:'不要'};
function stat(value,label){let d=el('div','stat');d.append(el('b','',value),el('span','',label));return d}
function updateStats(){let ready=DATA.rows.filter(x=>x.status==='draft'),accepted=ready.filter(x=>x.review?.decision==='approved').length;$('stats').replaceChildren(stat(DATA.baseline,'当前公开模板'),stat(DATA.target,'目标规模'),stat(ready.length,'本轮可审核成品'),stat(ready.filter(x=>x.animated).length,'实际动图候选'),stat(accepted,'已标可用 · 尚未入库'));}
function rating(r){return r.review?.decision||''}function media(r,out){return out?'/media/'+out.file:'/source/'+r.key}
function mini(r,path,label){let f=el('figure'),im=el('img');im.src=path;im.loading='lazy';im.onclick=()=>detail(r);f.append(im,el('figcaption','',label));return f}
function render(){let q=$('query').value.trim().normalize('NFKC').toLowerCase().split(/\s+/).filter(Boolean),kind=$('kind').value,state=$('state').value;filtered=DATA.rows.filter(r=>{if(state==='failed')return r.status!=='draft';if(r.status!=='draft')return false;if(state==='pending'&&rating(r))return false;if(!['all','pending'].includes(state)&&rating(r)!==state)return false;if(kind==='gif'&&!r.animated||kind==='image'&&!r.image_slots||kind==='text'&&r.image_slots||kind==='rank'&&!r.source_rank)return false;let text=[r.key,r.name,r.review?.name,...r.keywords].join(' ').normalize('NFKC').toLowerCase();return q.every(t=>text.includes(t))});let pages=Math.max(1,Math.ceil(filtered.length/18));page=Math.min(page,pages);$('count').textContent=filtered.length+' 项';$('page').textContent=page+' / '+pages;$('prev').disabled=page===1;$('next').disabled=page===pages;$('empty').hidden=filtered.length>0;$('grid').replaceChildren();for(let r of filtered.slice((page-1)*18,page*18)){let c=el('article','card'),h=el('div','card-head');h.append(el('div','badges',r.animated?'GIF · '+r.frames+' 帧 · '+(r.duration_ms/1000).toFixed(2)+' 秒':'静图'),el('h3','',r.review?.name||r.name||r.key),el('div','badges',r.source_rank?'来源榜单 #'+r.source_rank+' · 热度值 '+r.source_heat:'仓库参考 · 无热度排名'));c.append(h);let pair=el('div','pair');pair.append(mini(r,media(r),'原图'));if(r.outputs?.length)pair.append(mini(r,media(r,r.outputs[0]),r.image_slots?'S03 实际头像替换':'实际改字'));c.append(pair);let b=el('div','card-bottom');b.append(el('div','quiet',r.status==='draft'?(r.image_slots+' 个头像位 / '+r.text_slots+' 个原文位'):(r.reason||'等待处理')),el('div','terms',(r.review?.keywords?.length?r.review.keywords:r.keywords).join(' · ')));if(rating(r))b.append(el('div','rating',labels[rating(r)]));let bt=el('button','','查看完整动图与审核');bt.onclick=()=>detail(r);b.append(bt);c.append(b);$('grid').append(c)}updateStats();}
function figure(r,out,label){let f=el('figure');f.append(el('figcaption','',label));let im=el('img');im.src=media(r,out);f.append(im);if(r.animated){let strip=el('img','frames');strip.src='/frames/'+r.key+'/'+(out?out.sample:'source');f.append(strip)}return f}
async function saveDecision(r,decision){let note=$('note').value,name=$('newname').value,keywords=$('terms').value.split(/[\n,，、;；]+/).map(x=>x.trim()).filter(Boolean);$('saved').textContent='正在保存…';try{let response=await fetch('/api/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:r.key,spec_sha256:r.spec_sha256,decision,note,name,keywords})}),data=await response.json();if(!response.ok)throw Error(data.error);r.review=data.record;$('saved').textContent='已保存到本机 · '+(labels[decision]||'备注');render()}catch(e){$('saved').textContent='保存失败：'+e.message;$('saved').className='error'}}
function detail(r){opened=r.key;order=filtered.map(x=>x.key);let d=$('detail');d.replaceChildren();let head=el('div','detail-head'),title=el('div');title.append(el('div','eyebrow','待审核 · 未发布'),el('h2','',r.review?.name||r.name||r.key),el('div','source-key',r.key));let close=el('button','','关闭 ×');close.onclick=()=>$('modal').classList.remove('open');head.append(title,close);d.append(head);if(r.status!=='draft'){d.append(el('p','error',r.reason||'尚无成品，不提供通过选项。'));$('modal').classList.add('open');return}let checks=el('div','checks');checks.append(el('span','',r.animated?'完整循环 '+r.duration_ms+' ms / 输出 '+r.frames+' 帧 / 原始 '+r.original_frames+' 帧':'静态来源'),el('span','',r.image_slots+' 个头像位，'+r.text_slots+' 个文字位'),el('span','',r.source_rank?'来源排名 #'+r.source_rank+'，热度值 '+r.source_heat:'来源无热度数据'));d.append(checks);d.append(el('div','notice','这里是离线提案。头像替换使用照片自身的表情，不承诺自动表情迁移。请检查完整动画、五官残留、保护的手/道具和所有字幕；文字为 OCR 初稿，需要校对。'));let m=el('div','detail-media');m.append(figure(r,null,'原始场景与动作'));for(let out of r.outputs.filter(x=>!['blank','edited'].includes(x.sample)))m.append(figure(r,out,r.image_slots?out.sample+' · 实际替换':'原文替换 · '+out.texts.join(' / ')));d.append(m);let extra=r.outputs.filter(x=>['blank','edited'].includes(x.sample));if(extra.length){let de=el('details'),summary=el('summary','','检查旧字清除 / 改字结果（必看）');de.append(summary);let mm=el('div','detail-media');for(let out of extra)mm.append(figure(r,out,out.sample==='blank'?'清空所有可编辑文字，检查残留':'更换完整原文'));de.append(mm);d.append(de)}let captions=el('details');captions.append(el('summary','','查看原文字盘点与输入要求'),el('div','caption-list',r.caption_inventory.map(c=>(c.editable?'可编辑 #'+(c.slot+1):'保留原字')+'：'+c.original_text).join('\n')));d.append(captions);let links=el('p','detail-links');for(let [text,url] of [['来源页面',r.source_url],['来源素材',r.image_url]]){let a=el('a','',text);a.href=url;a.target='_blank';a.rel='noopener noreferrer';links.append(a)}d.append(links);let form=el('div','review-form');for(let [label,id,value,tag] of [['模板名字（可改）','newname',r.review?.name||r.name,'input'],['搜索关键词（每行一个，可补充）','terms',(r.review?.keywords?.length?r.review.keywords:r.keywords).join('\n'),'textarea'],['审核说明 / 需要修改的位置','note',r.review?.note||'','textarea']]){let l=el('label',id==='note'?'wide':'',label),input=el(tag);input.id=id;input.value=value;if(tag==='textarea')input.rows=id==='terms'?4:3;input.maxLength=id==='note'?1000:id==='newname'?40:5000;l.append(input);form.append(l)}d.append(form);let actions=el('div','actions');for(let [value,label,cls] of [['approved','可用，待入库','approve'],['adjust','需要调整','adjust'],['reject','不要','reject'],['','仅保存备注','']]){let b=el('button',cls,label);b.onclick=()=>saveDecision(r,value);actions.append(b)}let saved=el('span','quiet',r.review?.updated_at?'此前已保存 · '+(labels[rating(r)]||'备注'):'尚未标记');saved.id='saved';actions.append(saved);d.append(actions);let nav=el('div','actions');for(let [delta,label] of [[-1,'上一项'],[1,'下一项']]){let b=el('button','',label);b.onclick=()=>move(delta);nav.append(b)}nav.append(el('span','quiet','逐项审核；未标记项会保留为待审。'));d.append(nav);$('modal').classList.add('open');$('modal').scrollTop=0;}
function move(delta){let i=order.indexOf(opened),r=DATA.rows.find(r=>r.key===order[i+delta]);if(r)detail(r)}
async function load(){let response=await fetch('/api/data');if(!response.ok)throw Error('候选读取失败');DATA=await response.json();if(DATA.withdrawn){document.querySelector('h1').textContent='本轮候选已撤销';document.querySelector('header p').textContent=DATA.withdrawn.reason+' 历史评价已保存，本批不会入库。';$('kind').disabled=true;$('state').disabled=true;}for(let r of DATA.rows){r.keywords=r.keywords||[];r.caption_inventory=r.caption_inventory||[]}render()}
for(let id of ['kind','state'])$(id).onchange=()=>{page=1;render()};$('query').oninput=()=>{page=1;render()};$('prev').onclick=()=>{page--;render();window.scrollTo(0,0)};$('next').onclick=()=>{page++;render();window.scrollTo(0,0)};$('refresh').onclick=()=>load().catch(e=>alert(e.message));$('export').onclick=()=>{let a=el('a');a.href='/api/export';a.download='gensticker-expansion-review-20261030.json';a.click()};$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal').classList.remove('open');if($('modal').classList.contains('open')&&!['TEXTAREA','INPUT'].includes(document.activeElement.tagName)){if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)}});load().catch(e=>{$('count').textContent=e.message;$('count').className='error'});
</script></html>
