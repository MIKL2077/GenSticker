<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GenSticker · 猫咪换脸审核</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#242b29;background:#f4f4ee;line-height:1.6}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit;color:inherit}button,select{cursor:pointer}button,input,select,textarea{border:1px solid #cdd4cd;border-radius:8px;background:white;padding:9px 13px}button:hover{border-color:#14735d}button:disabled{opacity:.45;cursor:default}header{padding:28px 30px;background:#fff;border-bottom:1px solid #d6ddd6}.eyebrow{color:#547466;font-size:11px;letter-spacing:2px}h1{font-size:28px;margin:6px 0}h2{font-size:23px;margin:4px 0}h3{font-size:17px;margin:0}.intro{max-width:850px;color:#627068;font-size:14px}.stats{display:flex;gap:36px;flex-wrap:wrap;margin-top:20px}.stat b{display:block;font-size:27px}.stat span,.muted{font-size:12px;color:#707e75}.bar{display:flex;gap:10px;flex-wrap:wrap;padding:18px 30px;position:sticky;top:0;background:#f4f4eef5;z-index:1;border-bottom:1px solid #d9e0d7}#search{flex:1;min-width:180px}main{padding:24px 30px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;max-width:1400px;margin:auto}.card{background:#fff;border:1px solid #d5ddd4;border-radius:12px;overflow:hidden}.card-head,.card-foot{padding:14px 16px}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:#e8ece5;padding:8px}.pair img{width:100%;height:230px;object-fit:contain;background:#f7f8f2}figure{margin:0;text-align:center}figcaption{font-size:12px;color:#53685a;padding:5px}.tag{font-size:11px;color:#3f6b55}.terms{font-size:12px;color:#68776b;max-height:38px;overflow:hidden;margin:8px 0}.pager{display:flex;gap:20px;justify-content:center;padding:25px}.notice{padding:13px 16px;background:#eef4e9;border-left:3px solid #8cab7c;font-size:13px;margin:16px 0}footer{padding:18px 30px;font-size:12px;color:#68776b}.modal{display:none;position:fixed;inset:0;overflow:auto;background:#172820a9;z-index:5;padding:24px}.modal.open{display:block}.detail{max-width:1300px;margin:auto;background:#fff;border-radius:14px;padding:24px}.detail-head{display:flex;justify-content:space-between;gap:15px}.key{font-size:11px;color:#77857b;overflow-wrap:anywhere}.compare{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.compare figure{background:#f2f4ee;padding:8px;border-radius:9px}.compare img{width:100%;height:300px;object-fit:contain}.compare .strip{height:auto;max-height:120px}.compare strong{display:block;font-size:14px}.choices{display:flex;flex-wrap:wrap;gap:15px;margin:20px 0}.choice{border:1px solid #d8e0d6;border-radius:8px;padding:12px;cursor:pointer}.choice input{margin-right:8px}.form{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.form label{display:flex;flex-direction:column;font-size:13px;gap:6px}.form .wide{grid-column:1/-1}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:18px 0}.approve{background:#166c53;color:white;border:0}.reject{color:#a04634}.bad{color:#a74b30;font-size:13px}.tracking{width:100%;max-height:420px;object-fit:contain}.links{font-size:12px}.links a{color:#276a55;margin-right:14px}details{padding:10px 0;border-top:1px solid #e1e6df}summary{cursor:pointer;font-size:13px}.failures{display:flex;gap:10px;flex-wrap:wrap}.failures img{width:180px;height:200px;object-fit:contain}.empty{padding:40px;text-align:center;color:#6f7b71}
@media(max-width:950px){.grid{grid-template-columns:1fr}.compare{grid-template-columns:repeat(2,minmax(0,1fr))}.compare img{height:260px}.modal{padding:12px}.detail{padding:16px}}@media(max-width:540px){header,main,.bar{padding:18px}.stats{gap:22px}.stat b{font-size:23px}.pair img{height:180px}.form{grid-template-columns:1fr}.compare img{height:200px}.choice{width:100%}}
</style>
<header><div class="eyebrow">GENSTICKER / TENOR CAT · FACE FIRST</div><h1>猫咪换脸，先把融合做对。</h1><p class="intro">本轮全部需要上传头像，原字幕保留。对比同一张头像的完整动图：面部融合、轻微几何驱动、GANimation 小模型。上一轮改字批次已撤销。</p><div class="stats" id="stats"></div></header>
<div class="bar"><input id="search" placeholder="搜情绪、动作或关键词"><select id="portrait" aria-label="测试头像"><option>S03</option><option>S17</option><option>S29</option></select><select id="status" aria-label="审核状态"><option value="pending">尚未审核</option><option value="all">全部候选</option><option value="approved">可用，待入库</option><option value="adjust">需要调整</option><option value="reject">不要</option></select><button id="refresh">刷新评价</button><button id="export">导出评价</button><span id="count" class="muted"></span></div>
<main><div id="grid" class="grid"></div><div id="empty" class="empty" hidden>当前筛选条件下没有候选。</div><div class="pager"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div></main>
<footer>这是本机待审成品。照片和样张留在本机；保存评价不会发布。表情曲线是逐模板离线标定，不能保证眼神方向、伸舌、新牙齿或不可见侧脸的还原。来源署名不等于取得再利用许可。</footer>
<div class="modal" id="modal"><article class="detail" id="detail"></article></div>
<script>
const $=id=>document.getElementById(id),make=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
const labels={approved:'可用，待入库',adjust:'需要调整',reject:'不要'};
let DATA={rows:[]},filtered=[],page=1,opened='',order=[];
const rating=r=>r.review?.decision||'',sample=()=>$('portrait').value;
const media=(r,method,portrait=sample())=>r.outputs.find(o=>o.portrait===portrait&&o.method===method);
function stat(value,label){const d=make('div','stat');d.append(make('b','',value),make('span','',label));return d}
function updateStats(){const rows=DATA.rows;$('stats').replaceChildren(stat(rows.length,'本轮猫咪换脸'),stat(rows.filter(r=>r.animated).length,'完整动图'),stat(rows.filter(r=>r.text_slots&&!r.image_slots).length,'纯改字模板'),stat(rows.filter(r=>rating(r)==='approved').length,'已标可用 · 未入库'));}
function picture(src,label,click){const f=make('figure'),im=make('img');im.src=src;im.loading='lazy';if(click)im.onclick=click;f.append(im,make('figcaption','',label));return f}
function render(){const query=$('search').value.trim().normalize('NFKC').toLowerCase(),status=$('status').value;filtered=DATA.rows.filter(r=>{if(status==='pending'&&rating(r))return false;if(!['all','pending'].includes(status)&&rating(r)!==status)return false;return !query||[r.name,...r.keywords].join(' ').normalize('NFKC').toLowerCase().includes(query)});const pages=Math.max(1,Math.ceil(filtered.length/6));page=Math.min(page,pages);$('count').textContent=filtered.length+' 项';$('page').textContent=page+' / '+pages;$('prev').disabled=page===1;$('next').disabled=page===pages;$('empty').hidden=filtered.length>0;$('grid').replaceChildren();for(const r of filtered.slice((page-1)*6,page*6)){const card=make('article','card'),head=make('div','card-head');head.append(make('div','tag','GIF · '+r.frames+' 帧 · '+(r.duration_ms/1000).toFixed(2)+' 秒 · 1 个头像位'),make('h3','',r.review?.name||r.name));card.append(head);const pair=make('div','pair'),method=r.review?.method||r.recommended_method||'geometry',out=media(r,method);pair.append(picture('/source/'+r.key,'原始场景与动作',()=>detail(r)),picture('/media/'+out.file,sample()+' · '+r.methods[method].label,()=>detail(r)));card.append(pair);const foot=make('div','card-foot');foot.append(make('div','muted',rating(r)?labels[rating(r)]:'未审核 · 不会自动发布'),make('div','terms',r.keywords.join(' · ')));const button=make('button','','对比三种换脸方案与审核');button.onclick=()=>detail(r);foot.append(button);card.append(foot);$('grid').append(card)}updateStats()}
function comparison(r,method){const figure=make('figure'),name=method?r.methods[method].label:'原图',out=method?media(r,method):null;figure.append(make('strong','',name));const im=make('img');im.src=out?'/media/'+out.file:'/source/'+r.key;figure.append(im);const strip=make('img','strip');strip.src='/frames/'+r.key+'/'+(out?out.sample:'source');figure.append(strip);if(out)figure.append(make('figcaption','',sample()+' · '+out.frames+' 帧 · '+(out.duration_ms/1000).toFixed(2)+' 秒'));return figure}
function detail(r){opened=r.key;order=filtered.map(x=>x.key);const d=$('detail');d.replaceChildren();const head=make('div','detail-head'),title=make('div');title.append(make('div','eyebrow','待审核 · 未发布'),make('h2','',r.review?.name||r.name),make('div','key',r.key));const close=make('button','','关闭 ×');close.onclick=()=>$('modal').classList.remove('open');head.append(title,close);d.append(head,make('div','notice','融合使用上传者自己的五官，不粘贴猫的眼睛或嘴巴。请完整看一遍动作，检查双眼、嘴部残留、眼镜、毛发边缘和原字幕。当前对比头像：'+sample()+'；关闭后可在顶部切换另外两张。'));const compare=make('div','compare');compare.append(comparison(r,null));for(const method of Object.keys(r.methods))if(!r.blocked_methods?.[method])compare.append(comparison(r,method));d.append(compare);if(r.previous_review)d.append(make('div','notice','上一版评价：'+(labels[r.previous_review.decision]||'备注')+'。方案已变化，当前版本需要重新审核；原评价仍保留。'));const blocked=Object.entries(r.blocked_methods||{});if(blocked.length){const extra=make('details');extra.append(make('summary','bad','已诊断失败方案（不能选择）'));for(const [method,reason] of blocked){extra.append(make('p','bad',r.methods[method].label+'：'+reason),comparison(r,method))}d.append(extra)}const choices=make('div','choices');for(const [method,value] of Object.entries(r.methods)){if(r.blocked_methods?.[method])continue;const label=make('label','choice'),radio=make('input');radio.type='radio';radio.name='method';radio.value=method;radio.checked=(r.review?.method||r.recommended_method||'geometry')===method;label.append(radio,document.createTextNode(value.label));choices.append(label)}d.append(choices);const track=make('details');track.append(make('summary','','查看首 / 中 / 尾帧的替换范围'));const mask=make('img','tracking');mask.src='/tracking/'+r.key;track.append(mask,make('p','muted','红色为本轮离线提案的替换范围，不能据此视为视觉通过。耳朵、身体、原字幕、手和道具应在范围之外。'));d.append(track);const requirements=make('details');requirements.append(make('summary','','来源、表情能力与限制'),make('p','muted',(r.limitations||[]).join('；')),make('p','muted','Tenor 记录的分享次数：'+(r.source_shares??'未提供')+'。这是来源字段快照，并非本小程序热度。许可未核实，当前仅本地待审。'));const links=make('p','links');try{const url=new URL(r.source_url);if(url.protocol==='https:'&&url.hostname==='tenor.com'){const a=make('a','','查看 Tenor 原始素材');a.href=url.href;a.target='_blank';a.rel='noopener noreferrer';links.append(a)}}catch(_){}requirements.append(links);d.append(requirements);const form=make('div','form');for(const [label,id,value,tag] of [['模板名称','newname',r.review?.name||r.name,'input'],['搜索关键词（每行一个）','terms',(r.review?.keywords||r.keywords).join('\n'),'textarea'],['审核说明 / 需要修改的位置','note',r.review?.note||'','textarea']]){const l=make('label',id==='note'?'wide':'',label),input=make(tag);input.id=id;input.value=value;if(tag==='textarea')input.rows=id==='note'?3:4;l.append(input);form.append(l)}d.append(form);const actions=make('div','actions');for(const [decision,label,cls] of [['approved','可用，记录所选方案','approve'],['adjust','需要调整',''],['reject','不要','reject'],['','仅保存备注','']]){const button=make('button',cls,label);button.onclick=()=>save(r,decision);actions.append(button)}const saved=make('span','muted',r.review?.updated_at?'已保存：'+(labels[rating(r)]||'备注'):'尚未标记');saved.id='saved';actions.append(saved);d.append(actions);const nav=make('div','actions');for(const [delta,label] of [[-1,'上一项'],[1,'下一项']]){const b=make('button','',label);b.onclick=()=>{const next=DATA.rows.find(x=>x.key===order[order.indexOf(opened)+delta]);if(next)detail(next)};nav.append(b)}d.append(nav);$('modal').classList.add('open');$('modal').scrollTop=0;}
async function save(r,decision){const method=document.querySelector('input[name="method"]:checked')?.value;if(!method)return;$('saved').textContent='正在保存…';try{const response=await fetch('/api/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:r.key,spec_sha256:r.spec_sha256,method,portrait:sample(),selected_spec_sha256:r.methods[method].spec_sha256,decision,name:$('newname').value,keywords:$('terms').value.split(/[\n,，、;；]+/).map(x=>x.trim()).filter(Boolean),note:$('note').value})}),data=await response.json();if(!response.ok)throw Error(data.error);r.review=data.record;$('saved').textContent='已保存到本机 · '+(labels[decision]||'备注');render()}catch(error){$('saved').textContent='保存失败：'+error.message}}
async function load(){const response=await fetch('/api/data');if(!response.ok)throw Error('候选读取失败');DATA=await response.json();for(const r of DATA.rows){r.keywords=r.keywords||[];r.methods=r.methods||{}}render()}
$('search').oninput=()=>{page=1;render()};for(const id of ['portrait','status'])$(id).onchange=()=>{page=1;render()};$('prev').onclick=()=>{page--;render();window.scrollTo(0,0)};$('next').onclick=()=>{page++;render();window.scrollTo(0,0)};$('refresh').onclick=()=>load().catch(e=>alert(e.message));$('export').onclick=()=>{const a=make('a');a.href='/api/export';a.download='tenor-face-review.json';a.click()};$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal').classList.remove('open')});load().catch(e=>{$('count').textContent=e.message});
</script></html>
