<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GenSticker · 全库模板评估</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#182b42;background:#f2f5f9}*{box-sizing:border-box}body{margin:0}header{background:#142b43;color:white;padding:28px max(24px,calc((100vw - 1440px)/2))}h1{font-size:29px;margin:8px 0}p{line-height:1.65;margin:8px 0}.muted{color:#7890a6;font-size:13px}.header-sub{color:#bfcedc;font-size:14px}.stats{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}.stat{padding:13px 20px;border:1px solid #40566e;border-radius:10px;min-width:130px;background:#213a53}.stat b{display:block;font-size:27px}.stat span{font-size:12px;color:#bdd0df}main{max-width:1480px;margin:auto;padding:20px}.intro{background:white;border-left:4px solid #d39a3c;border-radius:10px;padding:14px 18px;font-size:14px;display:flex;gap:20px;align-items:center}.source-photo{width:70px;height:70px;object-fit:contain;border-radius:8px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#f2f5f9f5;position:sticky;top:0;z-index:2;padding:14px 0}input,select,button,textarea{font:inherit;color:inherit;background:white;border:1px solid #cbd6e1;border-radius:8px;padding:9px 11px;font-size:13px}button{cursor:pointer}button:hover{border-color:#477cb9}input{min-width:210px}a{color:#2c62a3}button.primary{background:#244d79;color:white}.save{font-size:12px;color:#508467;margin-left:auto}.save.error{color:#b34040}.summary{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px;gap:10px;font-size:13px}.pager{display:flex;gap:9px;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(295px,1fr));gap:16px}.card{background:white;border:1px solid #d9e2ec;border-radius:12px;overflow:hidden}.card:hover{border-color:#7b9ec7}.cardhead{padding:12px 13px;display:flex;justify-content:space-between;gap:10px;cursor:pointer}.id{font-size:11px;color:#7a8c9f;margin-bottom:4px}.name{font-size:16px;font-weight:600}.badge{font-size:12px;padding:4px 7px;white-space:nowrap;border-radius:5px;color:#2c629d;background:#eaf2fa;height:max-content}.badge.B{color:#7651a2;background:#f0eafa}.pictures{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#e2e8ef;cursor:pointer}.pictures img{width:100%;height:170px;object-fit:contain;background:#fafbfd}.labels{display:flex;justify-content:space-around;font-size:11px;color:#8190a2;padding:5px}.foot{padding:8px 13px 12px;font-size:12px;color:#6e8095;line-height:1.8}.prior{color:#9a6a22}.green{color:#267c57}.rating{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.rating button{padding:6px 9px;font-size:12px}.rating button.chosen{background:#244d79;color:white}.rating .clear{color:#8a9aaa;background:none;border-color:transparent}.modal{position:fixed;inset:0;display:none;z-index:10;background:#10283f99;overflow:auto;padding:20px}.modal.open{display:block}.panel{max-width:1220px;margin:0 auto;background:#f2f5f9;border-radius:13px;padding:22px}.modaltools{display:flex;gap:8px;justify-content:flex-end;position:sticky;top:0;z-index:4;background:#f2f5f9ed;padding:5px}.compare{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.compare>div{background:white;padding:12px;border-radius:9px}.compare img{height:340px;width:100%;object-fit:contain;background:#fafbfd}.compare .label{font-size:13px;color:#71849a;margin-bottom:10px}.links{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0;font-size:13px}.detail-rating{background:white;border-radius:10px;padding:14px;margin-top:16px}.note{margin-top:12px;display:flex;gap:10px;align-items:start}.note textarea{width:100%;max-width:680px;min-height:60px;font-size:13px}.footer{font-size:12px;color:#7b8da0;margin:24px 0}.bad{color:#b34242;padding:20px}.empty{padding:45px;color:#768b9f}#page-bottom{justify-content:center;margin-top:20px}@media(max-width:750px){h1{font-size:22px}.compare{grid-template-columns:1fr}.compare img{height:300px}.modal{padding:5px}.panel{padding:10px}.intro{align-items:start;gap:10px}.toolbar{position:relative}.stat{min-width:100px;padding:10px}.save{width:100%;margin-left:0}}
</style>
<style>@media(max-width:750px){.compare{grid-template-columns:1fr 1fr}.compare img{height:270px}.compare>div:first-child{grid-column:1/-1;display:flex;align-items:center;gap:12px}.compare>div:first-child img{width:140px;height:125px}.compare>div:first-child .label{flex:1}.id{overflow-wrap:anywhere}}</style>
<header><div class="header-sub">GENSTICKER · S03 全库复测 · 按模板版本保留评价</div><h1 id="heading">正在加载全库评估结果…</h1><p class="header-sub" id="subtitle"></p><div class="stats" id="stats"></div></header>
<main>
<div class="intro"><img class="source-photo" src="sources/S03.png" alt="S03 测试照片"><div><strong>本轮使用 S03，其他用户无需重复标注。</strong><p id="changes"></p><div class="muted">卡片显示原模板与当前实测结果。点击查看大图、调整前结果和完整 GIF。A / B 沿用原算法；“原算法”表示直接贴图或既有生成方式。</div></div></div>
<div class="toolbar"><input id="search" placeholder="搜索模板名、编号、key"><select id="scope" aria-label="评估范围"><option value="pending">待评估 / 待复核</option><option value="repaired">本轮修正的 13 个</option><option value="new">新增测试模板</option><option value="all">全部模板</option><option value="old">上一轮 100 个</option><option value="可用">可用</option><option value="需调整">需调整</option><option value="不需要">不需要</option><option value="不可用">不可用</option></select><select id="adapter" aria-label="生成路径"><option value="">所有生成路径</option><option value="declarative">声明式配方</option><option value="native-input">原生 Python</option></select><select id="status" aria-label="执行状态"><option value="">全部执行状态</option><option value="fused">实际执行融合</option><option value="fallback">原算法 / 直接贴图</option><option value="failed">生成失败</option></select><button id="export">导出全部标注</button><span class="save" id="save">标注正在加载</span></div>
<div class="summary"><span id="count"></span><div class="pager"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div></div>
<div class="grid" id="grid"></div><div class="pager" id="page-bottom"><button id="prev-bottom">上一页</button><button id="next-bottom">下一页</button></div>
<div class="footer" id="footer"></div>
</main>
<div class="modal" id="modal"><div class="panel"><div class="modaltools"><button id="detail-prev">← 上一个</button><button id="detail-next">下一个 →</button><button id="close">关闭 ×</button></div><div id="detail"></div></div></div>
<script>
const $=id=>document.getElementById(id),LOCAL='gensticker-template-reviews-v2',SIZE=36;
let DATA,records={},filtered=[],detailOrder=[],page=0,opened=null;
function el(tag,cls,text){let n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function picture(path){let n=el('img');n.src=path;n.loading='lazy';return n}
function media(name){return 'media/'+encodeURIComponent(name)}
function rid(t){return t.key+'@'+t.version+':S03'}
function review(t){return records[rid(t)]||{rating:'',note:''}}
function stateText(c){return c.status==='fused'?'已融合':c.status==='failed'?'生成失败':'原算法 / 直接贴图'}
async function save(t,rating,note){
  let value={key:t.key,version:t.version,sample:'S03',rating,note:note??review(t).note??''};
  records[rid(t)]={...value,updated_at:Date.now()/1000};localStorage.setItem(LOCAL,JSON.stringify(records));
  $('save').textContent='正在保存到本机…';$('save').className='save';
  try{let r=await fetch('/api/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(value)});if(!r.ok)throw Error(r.status);let d=await r.json();records[rid(t)]=d.record;localStorage.setItem(LOCAL,JSON.stringify(records));$('save').textContent='已保存到本机 · 浏览器同步备份'}
  catch(e){$('save').textContent='本机保存失败，浏览器已有备份；请导出标注';$('save').className='save error'}
  if(opened)detail(opened,false);render(false);
}
function ratings(t){let box=el('div','rating');for(let label of ['可用','需调整','不可用','不需要']){let button=el('button',review(t).rating===label?'chosen':'',label);if(label==='不需要')button.title='直接贴图即可，不需要融合';button.onclick=e=>{e.stopPropagation();let note=opened===t?$('detail-note')?.value:undefined;save(t,label,note)};box.append(button)}if(review(t).rating){let b=el('button','clear','撤销');b.onclick=e=>{e.stopPropagation();save(t,'')};box.append(b)}return box}
function matches(t){let c=DATA.caseById.get(t.id),r=review(t),scope=$('scope').value,q=$('search').value.trim().toLowerCase();if(q&&!(t.id+' '+t.name+' '+t.key).toLowerCase().includes(q))return false;if($('adapter').value&&t.adapter!==$('adapter').value)return false;if($('status').value&&c.status!==$('status').value)return false;if(scope==='pending'&&r.rating)return false;if(scope==='repaired'&&t.previous_rating!=='需调整')return false;if(scope==='new'&&t.previous_rating!=='新增测试')return false;if(scope==='old'&&Number(t.id.slice(1))>100)return false;if(['可用','需调整','不需要','不可用'].includes(scope)&&r.rating!==scope)return false;return true}
function render(reset=true){
  if(reset)page=0;filtered=DATA.templates.filter(matches);page=Math.max(0,Math.min(page,Math.ceil(filtered.length/SIZE)-1));$('grid').replaceChildren();
  for(let t of filtered.slice(page*SIZE,(page+1)*SIZE)){
    let c=DATA.caseById.get(t.id),card=el('article','card'),head=el('div','cardhead'),title=el('div');title.append(el('div','id',t.id+' · v'+t.version+(t.changed?' · 本轮已更新':'')),el('div','name',t.name));head.append(title,el('span','badge '+t.mode,c.status==='fused'?t.mode:'原算法'));head.onclick=()=>detail(t);
    let images=el('div','pictures');images.append(picture('thumbs/'+t.id+'-template.jpg'));images.append(c.result?picture('thumbs/'+t.id+'-after.jpg'):el('div','bad',c.error||'未生成'));images.onclick=()=>detail(t);
    let labels=el('div','labels');labels.append(el('span','','原模板'),el('span','','当前结果'+(c.result?.frames>1?' · GIF':'')));
    let foot=el('div','foot');foot.append(el('div',c.status==='fused'?'green':'',stateText(c)+' · '+(t.adapter==='declarative'?'声明式配方':'原生 Python')));
    if(c.result)foot.append(el('div','',c.result.size.join('×')+' · '+c.result.frames+' 帧 · '+Math.round(c.render_ms)+' ms'));
    if(t.previous_rating==='需调整')foot.append(el('div','prior','上轮：需调整 · 本次'+(review(t).rating?'已评价':'待复核')));else if(t.previous_rating==='新增测试')foot.append(el('div','muted','新增测试 · '+(review(t).rating?'已评价':'待标注')));else foot.append(el('div','muted','上轮：'+t.previous_rating));
    foot.append(ratings(t));card.append(head,images,labels,foot);$('grid').append(card)
  }
  if(!filtered.length)$('grid').append(el('div','empty','当前筛选没有模板。'));
  $('count').textContent=filtered.length+' / '+DATA.templates.length+' 个模板 · 本轮已记录 '+DATA.templates.filter(t=>review(t).rating).length+' 个评价';$('page').textContent=(filtered.length?page+1:0)+' / '+Math.ceil(filtered.length/SIZE);
  for(let id of ['prev','prev-bottom'])$(id).disabled=page===0;for(let id of ['next','next-bottom'])$(id).disabled=(page+1)*SIZE>=filtered.length;
}
function detail(t,open=true){
  if(open&&!$('modal').classList.contains('open'))detailOrder=filtered.slice();opened=t;let d=$('detail'),c=DATA.caseById.get(t.id);d.replaceChildren();d.append(el('div','id',t.id+' · '+t.key+' · v'+t.base_version+(t.changed?' → v'+t.version:'')),el('h2','',t.name),el('p','muted',t.change_note||'本轮实测输出，等待视觉评价。'));
  let compare=el('div','compare');for(let [label,file] of [['原模板 / 原生示例',t.preview],['调整前 · 上轮算法',c.baseline?.file],['当前结果 · '+stateText(c),c.result?.file]]){let cell=el('div');cell.append(el('div','label',label));if(file){cell.append(picture(media(file)));let link=el('a','muted','打开原尺寸'+(file.endsWith('.gif')?' GIF':''));link.href=media(file);link.target='_blank';cell.append(link)}else cell.append(el('p','bad',c.error||'未生成'));compare.append(cell)}d.append(compare);
  let links=el('div','links');if(c.result?.frames>1){let a=el('a','','查看完整逐帧对比');a.href='contacts/'+t.id+'.jpg';a.target='_blank';links.append(a)}if(t.region_sheet){let a=el('a','','查看本次替换区域（绿）与保护区');a.href='regions/'+t.region_sheet;a.target='_blank';links.append(a)}d.append(links);
  let box=el('div','detail-rating');box.append(el('div','',t.previous_rating==='需调整'?'上轮标记为“需调整”，当前版本需要重新评价。':'本次评价 · S03'),ratings(t));let note=el('div','note'),input=el('textarea');input.id='detail-note';input.maxLength=500;input.placeholder='可选：说明哪里需要调整，例如漏掉一只眼睛、挡住手或字幕。';input.value=review(t).note||'';let button=el('button','','保存说明');button.onclick=()=>save(t,review(t).rating||'',input.value);note.append(input,button);box.append(note);d.append(box);
  if(open)$('modal').classList.add('open');
}
function moveDetail(delta){let index=detailOrder.indexOf(opened),t=detailOrder[index+delta];if(t)detail(t)}
function movePage(delta){page+=delta;render(false);window.scrollTo({top:0,behavior:'instant'})}
for(let id of ['search','scope','adapter','status'])$(id).oninput=()=>render();for(let id of ['prev','prev-bottom'])$(id).onclick=()=>movePage(-1);for(let id of ['next','next-bottom'])$(id).onclick=()=>movePage(1);
$('close').onclick=()=>{$('modal').classList.remove('open');opened=null};$('modal').onclick=e=>{if(e.target===$('modal'))$('close').click()};$('detail-prev').onclick=()=>moveDetail(-1);$('detail-next').onclick=()=>moveDetail(1);document.onkeydown=e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(e.key==='Escape')$('close').click();if(opened&&e.key==='ArrowRight')moveDetail(1);if(opened&&e.key==='ArrowLeft')moveDetail(-1)};
$('export').onclick=()=>{let a=el('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({format:'gensticker-template-review-v2',records,templates:DATA.templates.map(t=>({id:t.id,key:t.key,version:t.version})),created:new Date().toISOString()},null,2)],{type:'application/json'}));a.download='GenSticker-全库模板-我的评价.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
Promise.all([fetch('data.json').then(r=>r.json()),fetch('/api/reviews').then(r=>{if(!r.ok)throw Error('annotation load failed');return r.json()})]).then(([data,saved])=>{
  DATA=data;DATA.caseById=new Map(data.cases.map(c=>[c.template,c]));records=saved.records;let local=JSON.parse(localStorage.getItem(LOCAL)||'{}');for(let [k,v] of Object.entries(local))if((v.updated_at||0)>(records[k]?.updated_at||0))records[k]=v;localStorage.setItem(LOCAL,JSON.stringify(records));
  $('heading').textContent=DATA.templates.length+' 个带图模板 · S03 全库评估';$('subtitle').textContent='覆盖当前快照的全部图片模板（'+DATA.snapshot_published+' 个已发布模板中的 '+DATA.templates.length+' 个）。纯文字模板未参与本轮。';
  for(let [value,label] of [[DATA.templates.length,'实际测试模板'],[DATA.counts.fused||0,'实际执行融合'],[DATA.counts.fallback||0,'原算法 / 直接贴图'],[DATA.counts.failed||0,'生成失败'],[DATA.templates.filter(t=>t.previous_rating==='新增测试').length,'新增测试覆盖']]){let box=el('div','stat');box.append(el('b','',value),el('span','',label));$('stats').append(box)}
  $('changes').textContent='保留 31 个“可用”模板效果；53 个“不需要”按原算法生成；13 个“需调整”已处理，等待你复核。原有编号和评价已保留。';$('save').textContent='标注已载入 · 后续自动保存到本机';
  $('footer').textContent='本机 CPU 实测；完整 GIF 已保留。尺寸异常 '+DATA.dimension_mismatches+'，时序异常 '+DATA.timeline_mismatches+'，循环异常 '+(DATA.loop_mismatches||0)+'。31 个已确认模板输出'+(DATA.accepted_output_changes?'存在变化，请复核':'逐帧保持一致')+'。渲染成功不代表视觉验收。测试照片与结果仅在本机私有目录。';render();
}).catch(e=>{$('heading').textContent='评估数据加载失败';$('save').textContent='请刷新重试；已有标注保留在浏览器和本机文件中';$('save').className='save error'});
</script>
</html>
