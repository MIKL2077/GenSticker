<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GenSticker · 奶龙 / 中文 / 主内模板审核</title>
<style>*{box-sizing:border-box}body{margin:0;background:#faf7f1;color:#463f36;font:15px/1.55 system-ui,-apple-system,sans-serif}header,main{max-width:1280px;margin:auto;padding:24px}header{padding-top:38px}h1{font-size:28px;margin:5px 0 10px}p{margin:8px 0;color:#81786d}.kicker{font-size:12px;letter-spacing:2px;color:#a36949}.toolbar{display:flex;gap:10px;flex-wrap:wrap;position:sticky;top:0;background:#faf7f1ee;padding:14px 0;z-index:2}input,select,button,textarea{font:inherit;border:1px solid #ded5c7;border-radius:10px;padding:9px 13px;background:#fff;color:inherit}input{flex:1;min-width:200px}button{cursor:pointer}button:hover{background:#f5e4ce}button.chosen{background:#8d5e3d;color:white;border-color:#8d5e3d}button[disabled]{cursor:not-allowed;opacity:.4}#grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#fff;border:1px solid #ebe3d6;border-radius:18px;overflow:hidden}.head{padding:18px 20px 10px}.id{color:#a47550;font:12px ui-monospace,monospace}.head h2{font-size:18px;margin:4px 0}.media{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 18px}.media img{width:100%;height:225px;object-fit:contain;background:#f8f8f5;border-radius:8px;cursor:zoom-in}.label{font-size:12px;color:#8a8174;text-align:center;margin:5px 0}.meta{padding:6px 20px;font-size:12px;color:#8a8174}.keywords{max-height:44px;overflow:hidden}.note{color:#a25c3c;background:#fff5e8;margin:10px 18px;padding:9px 12px;border-radius:8px}textarea{width:100%;min-height:56px;resize:vertical;font-size:13px}.controls{padding:10px 18px 18px}.ratings{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.variants{display:flex;gap:6px;padding:0 18px}.variants button{font-size:12px;padding:5px 9px}.status{font-size:12px;color:#84786b;margin-left:auto;align-self:center}dialog{max-width:94vw;max-height:94vh;padding:12px;border:0;border-radius:14px}dialog img{display:block;max-width:86vw;max-height:80vh}dialog::backdrop{background:#0009}a{color:#a36949}#summary{font-size:13px;color:#8a8174;margin:8px 0 18px}@media(max-width:800px){#grid{grid-template-columns:1fr}.media img{height:230px}header,main{padding:18px}h1{font-size:23px}}</style>
<header><div class="kicker">GENSTICKER · TEMPLATE REVIEW · 2026.11.03</div><h1>奶龙、中文日常与主内梗图</h1><p>对照原图和实际改字效果。可切换留空 / 两行文案检查残字；动图按完整循环播放，点图可放大。</p><p>本批是原字幕替换模板，不含换脸槽。来源与原水印保留，素材权利状态为未核实。审核保存在本机，点击通过不会自动发布。</p></header>
<main><div class="toolbar"><input id="query" placeholder="搜奶龙、阿们、代祷、猫猫或编号"><select id="group"><option value="">全部分类</option><option value="nailong">奶龙</option><option value="chinese">中文日常</option><option value="christian">主内</option></select><select id="scope"><option value="">全部审核状态</option><option value="pending">未审核</option><option value="通过">通过</option><option value="需调整">需调整</option><option value="不要">不要</option></select><button id="export">导出评价</button><span class="status" id="save">正在读取评价…</span></div><div id="summary"></div><div id="grid"></div></main><dialog id="zoom"><button id="close">关闭 ×</button><img id="large" alt="完整模板动图或图片"></dialog>
<script>
const $=id=>document.getElementById(id),labels={nailong:'奶龙',chinese:'中文日常',christian:'主内'};let rows=[],reviews={},findings={};const variants=new Map();
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function image(row,variant){const n=el('img');n.src='media/'+encodeURIComponent(row.id)+'/'+variant+row.suffix;n.loading='lazy';n.alt=row.name+' '+variant;n.onclick=()=>{$('large').src=n.src;$('zoom').showModal()};return n}
async function save(row,rating,note){$('save').textContent='正在保存…';try{const response=await fetch('/api/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:row.key,spec_sha256:row.spec_sha256,rating,note})});const data=await response.json();if(!response.ok)throw Error(data.error||response.status);reviews[row.key]=data;$('save').textContent='已保存到本机';render()}catch(e){$('save').textContent='保存失败：'+e.message}}
function render(){const q=$('query').value.trim().toLowerCase(),group=$('group').value,scope=$('scope').value;const filtered=rows.filter(r=>(!group||r.group===group)&&(!q||[r.id,r.name,...r.keywords].join(' ').toLowerCase().includes(q))&&(!scope||(scope==='pending'?!reviews[r.key]?.rating:reviews[r.key]?.rating===scope)));$('summary').textContent=`${rows.length} 个可查看草稿 · 当前显示 ${filtered.length} 个 · 已审核 ${Object.values(reviews).filter(r=>r.rating).length} 个；另有 4 份原素材保留为参考，未制作模板。`;$('grid').replaceChildren();for(const row of filtered){const prior=reviews[row.key]||{},finding=findings[row.id],card=el('article','card'),head=el('div','head');head.append(el('div','id',row.id+' · '+labels[row.group]+(row.frames>1?' · GIF':'')),el('h2','',row.name));const media=el('div','media');for(const [variant,label] of [['source',row.frames>1?'原图 · 完整循环':'原图'],[variants.get(row.key)||'changed','实际替换']]){const side=el('div');side.append(image(row,variant),el('div','label',label));media.append(side)}const tabs=el('div','variants');for(const [value,label] of [['changed','改字'],['blank','留空检查'],['multiline','两行文案']]){const b=el('button',variants.get(row.key)===value?'chosen':'',label);b.onclick=()=>{variants.set(row.key,value);render()};tabs.append(b)}const meta=el('div','meta');meta.append(el('div','keywords','搜索词：'+row.keywords.join('、')),el('div','',`${row.frames>1?row.frames+' 帧 · '+row.duration_ms+' ms · ':''}默认重建与固定区域像素检查通过`));const link=el('a','','查看来源');link.href=row.source_url;link.target='_blank';link.rel='noreferrer';meta.append(link);const controls=el('div','controls'),note=el('textarea');note.placeholder='评价或需要调整的地方';note.value=prior.note||'';note.onchange=()=>save(row,prior.rating||'',note.value);const buttons=el('div','ratings');for(const label of ['通过','需调整','不要','撤销']){const b=el('button',prior.rating===label?'chosen':'',label);b.disabled=label==='通过'&&finding?.blocked;b.onclick=()=>save(row,label==='撤销'?'':label,note.value);buttons.append(b)}controls.append(note,buttons);card.append(head,media,tabs,meta);if(finding)card.append(el('div','note',(finding.blocked?'暂不可通过：':'检查提示：')+finding.note));card.append(controls);$('grid').append(card)}}
$('query').oninput=render;$('group').onchange=render;$('scope').onchange=render;$('close').onclick=()=>$('zoom').close();$('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(reviews,null,2)],{type:'application/json'}));a.download='template-reviews-20261103.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
Promise.all([fetch('/drafts.json').then(r=>r.json()),fetch('/api/reviews').then(r=>r.json()),fetch('/review-findings.json').then(r=>r.json())]).then(([data,saved,notes])=>{rows=data.filter(r=>r.status==='draft-pending-review');reviews=saved;findings=notes;$('save').textContent='评价存储在本机';render()}).catch(e=>{$('save').textContent='读取失败：'+e.message});
</script></html>
