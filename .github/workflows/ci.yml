name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/meme-generator/pyproject.toml
            backend/pil-utils/pyproject.toml
            deploy/requirements-features.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig fonts-noto-cjk libgl1 libglib2.0-0
      - run: npm ci --prefix frontend
      - run: python -m pip install -e ./backend/meme-generator -r deploy/requirements-features.txt
      - run: python tools/qa/run_local.py --build --output artifacts/ci-regression.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-report
          path: artifacts/ci-regression.json
  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mkdir -p artifacts
      - name: Python runtime advisory gate
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install -e ./backend/meme-generator -r deploy/requirements-features.txt
          pip-audit --format json --output artifacts/python-audit.json
      - name: npm lockfile advisory gate
        if: always()
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high --json > ../artifacts/npm-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-security-report
          path: artifacts/*audit.json
