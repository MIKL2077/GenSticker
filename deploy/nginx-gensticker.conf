map $request_method $gensticker_job_limit_key {
    GET '';
    default $binary_remote_addr;
}
limit_req_zone $gensticker_job_limit_key zone=gensticker_jobs:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=gensticker_read:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=gensticker_analytics:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=gensticker_generate:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=gensticker_login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=gensticker_connections:10m;

log_format gensticker_timing '$time_iso8601 $remote_addr $request_method $uri '
                            'status=$status request_s=$request_time upstream_s=$upstream_response_time '
                            'received=$request_length sent=$body_bytes_sent';

server {
    listen 127.0.0.1:3002;
    listen 127.0.0.1:3000;
    server_name www.shangkun.uk;
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    client_max_body_size 15m;
    client_body_timeout 20s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn gensticker_connections 12;
    access_log /var/log/nginx/gensticker-access.log gensticker_timing;
    error_log /var/log/nginx/gensticker-error.log info;

    location = /gensticker/api/memes/categories {
        limit_req zone=gensticker_read burst=30 nodelay;
        gzip on;
        gzip_types application/json;
        gzip_min_length 1024;
        gzip_vary on;
        rewrite ^/gensticker/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3001;
        proxy_read_timeout 65s;
        proxy_set_header Host $host;
    }

    location = /gensticker/api/studio/live/results {
        limit_req zone=gensticker_generate burst=5 nodelay;
        client_max_body_size 520k;
        rewrite ^/gensticker/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3001;
        proxy_read_timeout 20s;
    }
    location = /gensticker/api/studio/live/assets {
        limit_req zone=gensticker_generate burst=3 nodelay;
        client_max_body_size 31m;
        client_body_timeout 60s;
        rewrite ^/gensticker/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3001;
        proxy_read_timeout 65s;
    }
    location = /gensticker/api/recommend/assets {
        limit_req zone=gensticker_generate burst=3 nodelay;
        client_max_body_size 4m;
        rewrite ^/gensticker/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3001;
        proxy_read_timeout 20s;
    }
    location = /gensticker/api/images/subject {
        limit_req zone=gensticker_generate burst=3 nodelay;
        client_max_body_size 12m;
        rewrite ^/gensticker/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3001;
        proxy_read_timeout 65s;
    }
    location = /gensticker/api/recommend/jobs {
        limit_req zone=gensticker_jobs burst=20 nodelay;
        rewrite ^/gensticker/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3001;
        proxy_read_timeout 20s;
    }
    location = /gensticker/api/auth/wechat {
        limit_req zone=gensticker_login burst=2 nodelay;
        rewrite ^/gensticker/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3001;
        proxy_read_timeout 15s;
    }
    location = /gensticker/api/templates/events {
        limit_req zone=gensticker_analytics burst=20 nodelay;
        rewrite ^/gensticker/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3001;
        proxy_read_timeout 10s;
    }

    location ~ ^/gensticker/api/memes/[^/]+/(generate|)$ {
        limit_req zone=gensticker_generate burst=3 nodelay;
        rewrite ^/gensticker/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3001;
        proxy_read_timeout 65s;
        proxy_set_header Host $host;
    }
    location /gensticker/api/ {
        limit_req zone=gensticker_read burst=30 nodelay;
        rewrite ^/gensticker/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3001;
        proxy_read_timeout 65s;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 65s;
    }
}
